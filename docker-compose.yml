version: "3.9"

services:

  # TimescaleDB
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: fabric_timescaledb
    restart: unless-stopped
    environment:
      POSTGRES_USER:     ${TIMESCALE_USER:-tsdb_user}
      POSTGRES_PASSWORD: ${TIMESCALE_PASSWORD:-change_me_please}
      POSTGRES_DB:       ${TIMESCALE_DB:-weather_ts}
    ports:
      - "${TIMESCALE_PORT:-5433}:5432"
    volumes:
      - timescale_data:/var/lib/postgresql/data
      - ./scripts/init_timescaledb.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${TIMESCALE_USER:-tsdb_user}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Grafana
  grafana:
    image: grafana/grafana:latest
    container_name: fabric_grafana
    restart: unless-stopped
    depends_on:
      timescaledb:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_USER:     admin
      GF_SECURITY_ADMIN_PASSWORD: admin   # change after first login
      GF_INSTALL_PLUGINS:         grafana-clock-panel,natel-discrete-panel
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana_dashboards/provisioning:/etc/grafana/provisioning:ro

volumes:
  timescale_data:
  grafana_data:
